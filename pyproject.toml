[build-system]
requires = ["setuptools>=64"]
build-backend = "setuptools.build_meta"

[project]
name = "mining-translator"
version = "0.1.0"
description = "Mining document translation tool with terminology glossary"
requires-python = ">=3.10"
dependencies = [
    "anthropic>=0.39.0",
    "openai>=1.0.0",
    "openpyxl>=3.1.0",
    "python-docx>=1.1.0",
    "python-pptx>=1.0.0",
    "pdfplumber>=0.11.0",
]

[project.scripts]
mining-translator = "mining_translator.cli:main"

[tool.setuptools.packages.find]
include = ["mining_translator*"]
